spring.application.name=bossapp
server.port=${PORT:8280}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,cm.ndicsonlabs.bossapp

# --- datasource: embedded H2 by default (NFR-03: swap to PostgreSQL by config) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/bossadb
#jdbc:h2:file:./data/bossadb;AUTO_SERVER=TRUE
#spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=postgres
spring.datasource.password=admin

spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.threads.virtual.enabled=true

spring.flyway.enabled=true
#spring.flyway.validateMigrationNaming=false

#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

app.finance.base-currency=USD
app.reconciliation.enabled=true
app.reconciliation.cron=0 30 1 * * *
app.auto-reversal.enabled=false